<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152b">
<title>白叶盘的附加网页</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:rgba(255,255,255,.085);--line:rgba(255,255,255,.15);--text:#f5f7ff;--muted:#aeb8d4;--a:#8b7cff;--b:#39d6d0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(ellipse at 15% 15%,#34306b 0,transparent 38%),radial-gradient(ellipse at 85% 75%,#075d69 0,transparent 35%),linear-gradient(135deg,#090d1b,#111a32 55%,#0b1020);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:330px;height:330px;border-radius:50%;filter:blur(90px);opacity:.22;z-index:-1;animation:float 12s ease-in-out infinite alternate;background:#8877ff;top:8%;left:-120px}body:after{background:#20d8ce;left:auto;right:-140px;top:auto;bottom:0;animation-delay:-5s}
@keyframes float{to{transform:translate(90px,65px) scale(1.2)}}@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.wrap{width:min(760px,calc(100% - 32px));margin:auto;padding:12vh 0 50px;text-align:center;animation:rise .8s ease both}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.06);color:#c8d2f3;font-size:13px;letter-spacing:1px}
.dot{width:7px;height:7px;border-radius:50%;background:#54e6bb;box-shadow:0 0 12px #54e6bb}
h1{font-size:clamp(32px,7vw,54px);letter-spacing:1px;margin:24px 0 10px;line-height:1.2;background:linear-gradient(100deg,#fff,#b8b1ff 48%,#7cebe2);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 38px;font-size:15px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;text-align:left}
.item{position:relative;min-height:100px;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--panel);backdrop-filter:blur(18px);color:var(--text);cursor:pointer;text-align:left;display:flex;align-items:center;gap:15px;transition:.25s;overflow:hidden}
.item:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent,rgba(255,255,255,.1),transparent);transform:translateX(-120%);transition:.6s}
.item:hover{transform:translateY(-5px);border-color:rgba(164,153,255,.65);background:rgba(255,255,255,.13);box-shadow:0 15px 35px #0004}.item:hover:before{transform:translateX(120%)}
.icon{width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#8174ff55,#32d9d055);border:1px solid #ffffff22}
.label{font-size:16px;font-weight:650}.hint{display:block;color:var(--muted);font-size:12px;margin-top:5px}.arrow{margin-left:auto;color:#aeb8d4;font-size:20px}
footer{margin-top:30px;color:#8994b4;font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(3,6,16,.68);backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}
.overlay.show{display:flex}.modal{width:min(560px,100%);max-height:min(78vh,700px);overflow:auto;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(31,39,72,.97),rgba(14,24,43,.97));box-shadow:0 25px 90px #0009;padding:24px;text-align:left;animation:pop .25s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.modal h2{font-size:22px;margin:0}.close{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:#ffffff0d;color:white;font-size:21px;cursor:pointer}.close:hover{background:#ffffff20}
.content{color:#dce4fa;line-height:1.8;overflow-wrap:anywhere}.content a{color:#8fe9e2}.contact-card{padding:14px;margin:10px 0;border:1px solid var(--line);border-radius:15px;background:#ffffff08}.contact-card strong{display:block;margin-bottom:5px}.contact-card p{margin:0;color:#c0cbe5}.contact-card a{display:inline-block;margin-top:8px}
.loading,.empty{color:var(--muted);padding:15px 0}.close-bottom{display:block;margin:20px 0 0 auto;padding:10px 18px;border:0;border-radius:12px;color:#10152b;font-weight:700;background:linear-gradient(100deg,#a99cff,#6de5dc);cursor:pointer}
@media(max-width:540px){.wrap{padding-top:9vh}.menu{grid-template-columns:1fr}.item{min-height:82px}.sub{margin-bottom:28px}.modal{padding:20px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="badge"><span class="dot"></span> BALDGRID · EXTRA</div>
  <h1>白叶盘的附加网页</h1>
  <p class="sub">一些额外入口与实用信息</p>
  <section class="menu" aria-label="网页选项">
    <button class="item" data-action="contact"><span class="icon">✉</span><span><span class="label">联系作者</span><span class="hint">查看作者联系方式</span></span><span class="arrow">›</span></button>
    <button class="item" data-action="about"><span class="icon">ⓘ</span><span><span class="label">关于本站</span><span class="hint">了解本站信息</span></span><span class="arrow">›</span></button>
    <button class="item" data-action="submit"><span class="icon">⇧</span><span><span class="label">资源投稿</span><span class="hint">提交你想分享的资源</span></span><span class="arrow">›</span></button>
    <button class="item" data-action="gift"><span class="icon">🎁</span><span><span class="label">惊喜礼物</span><span class="hint">打开一份小惊喜</span></span><span class="arrow">↗</span></button>
    <button class="item" data-action="back"><span class="icon">⌂</span><span><span class="label">返回资源站</span><span class="hint">回到白叶盘资源中心</span></span><span class="arrow">↗</span></button>
  </section>
  <footer>© 白叶 · 白叶盘的附加网页</footer>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <section class="modal">
    <div class="modal-head"><h2 id="modalTitle">标题</h2><button class="close" id="closeTop" aria-label="关闭">×</button></div>
    <div class="content" id="modalContent"><div class="loading">正在加载…</div></div>
    <button class="close-bottom" id="closeBottom">关闭</button>
  </section>
</div>
<script>
const overlay=document.getElementById('overlay');
const modalTitle=document.getElementById('modalTitle');
const modalContent=document.getElementById('modalContent');
function closeModal(){overlay.classList.remove('show')}
document.getElementById('closeTop').addEventListener('click',closeModal);
document.getElementById('closeBottom').addEventListener('click',closeModal);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function openModal(title,html){modalTitle.textContent=title;modalContent.innerHTML=html;overlay.classList.add('show')}
function safeText(v){return String(v??'')}
function escapeHTML(s){return safeText(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function linkHTML(url,label){try{const u=new URL(url,location.href);if(!['http:','https:','mailto:','tg:'].includes(u.protocol))return '';return `<a href="${escapeHTML(u.href)}" target="_blank" rel="noopener noreferrer">${escapeHTML(label||url)}</a>`}catch{return ''}}
async function loadJSON(file){const r=await fetch(file+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function renderContacts(data){
 const list=Array.isArray(data)?data:(data.contacts||data.items||data.links||[]);
 if(!Array.isArray(list)||!list.length)return '<div class="empty">暂时没有联系方式，请检查 zz.json。</div>';
 return list.map(x=>{
  if(typeof x==='string')return `<div class="contact-card">${escapeHTML(x)}</div>`;
  const title=x.title||x.name||x.label||'联系方式';
  const desc=x.content||x.description||x.value||'';
  const url=x.url||x.link||'';
  return `<div class="contact-card"><strong>${escapeHTML(title)}</strong>${desc?`<p>${escapeHTML(desc)}</p>`:''}${url?linkHTML(url,x.button||x.text||url):''}</div>`;
 }).join('');
}
function renderReadme(data){
 let text=typeof data==='string'?data:(data.content||data.readme||data.text||data.description||'');
 if(!text&&Array.isArray(data))text=data.map(x=>typeof x==='string'?x:(x.content||x.text||'')).join('\n\n');
 if(!text)return '<div class="empty">readme.json 中没有找到 content、readme、text 或 description 字段。</div>';
 // Simple safe Markdown-like rendering: headings, paragraphs, and line breaks.
 return escapeHTML(text).split(/\n{2,}/).map(p=>{
  const t=p.trim();
  if(/^### /.test(t))return `<h3>${t.slice(4)}</h3>`;
  if(/^## /.test(t))return `<h3>${t.slice(3)}</h3>`;
  if(/^# /.test(t))return `<h3>${t.slice(2)}</h3>`;
  return `<p>${t.replace(/\n/g,'<br>')}</p>`;
 }).join('');
}
document.querySelectorAll('.item').forEach(btn=>btn.addEventListener('click',async()=>{
 const action=btn.dataset.action;
 if(action==='gift'){location.href='https://fuli.xn--fiqz59cpva341l.top/';return}
 if(action==='back'){location.href='https://pan.baldgrid.cc.cd';return}
 if(action==='submit'){openModal('资源投稿','<p>直接上传即可，已开放上传功能</p>');return}
 if(action==='contact'||action==='about'){
  const title=action==='contact'?'联系作者':'关于本站';
  openModal(title,'<div class="loading">正在读取 '+(action==='contact'?'zz.json':'readme.json')+'…</div>');
  try{
   const data=await loadJSON(action==='contact'?'zz.json':'readme.json');
   modalContent.innerHTML=action==='contact'?renderContacts(data):renderReadme(data);
  }catch(err){
   modalContent.innerHTML=`<div class="empty">加载失败：${escapeHTML(err.message)}<br>请确认 ${action==='contact'?'zz.json':'readme.json'} 与 index.html 位于同一目录，并已上传到 GitHub Pages。</div>`;
  }
 }
}));
</script>
</body>
</html>
